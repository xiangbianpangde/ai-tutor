<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-tutor 教学状态</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#222c37; --line:#2c3947;
    --txt:#e6edf3; --dim:#8b98a5; --accent:#4fd1c5;
    --green:#48bb78; --yellow:#ecc94b; --red:#f56565; --blue:#63b3ed;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;padding:20px;max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  header h1{font-size:18px;font-weight:600;letter-spacing:.3px}
  header h1 .dot{color:var(--accent)}
  .ctrl{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px}
  .ctrl button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px}
  .ctrl button:hover{border-color:var(--accent)}
  #pulse{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;transition:opacity .3s}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .lbl{color:var(--dim);font-size:12px;margin-bottom:6px}
  .card .val{font-size:20px;font-weight:600}
  .card .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
  .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .step{padding:5px 11px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--dim)}
  .step.done{color:var(--green);border-color:var(--green)}
  .step.active{color:#0f1419;background:var(--accent);border-color:var(--accent);font-weight:600}
  .step .arrow{color:var(--line)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .bar .seg{height:14px;border-radius:3px}
  .bar .name{width:54px;color:var(--dim)}
  .hist{list-style:none;font-size:13px;max-height:180px;overflow:auto}
  .hist li{padding:4px 0;border-bottom:1px solid var(--line);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog-wrap{margin-top:4px}
  .prog{height:22px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .prog .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .5s}
  .phases{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .ph{flex:1;min-width:90px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12px}
  .ph.done{border-color:var(--green)} .ph.in_progress{border-color:var(--accent)}
  .ph .pn{color:var(--dim)} .ph .pv{font-weight:600;margin-top:2px}
  .idle{text-align:center;color:var(--dim);padding:60px 0;font-size:15px}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1><span class="dot">●</span> ai-tutor 教学状态</h1>
  <div class="ctrl">
    <span id="pulse"></span><span id="updated">—</span>
    <button onclick="load()">刷新</button>
  </div>
</header>
<div id="root"><div class="idle">加载中…</div></div>

<script>
const FLOW = {0:["SILENT","#8b98a5"],1:["SHALLOW","#63b3ed"],2:["FLUENT","#48bb78"],3:["DEEP","#4fd1c5"],4:["IMMERSED","#ecc94b"]};
const STEPS = {
  jiangjie:["GOAL","REDUCE","COMPLEMENT","RECONSTRUCT","REVIEW","NEXT"],
  reduction:["INTRO","EXPLAIN","CHECK","PRACTICE","NEXT"],
  feynman:["PROMPT","EVALUATE","PASS"],
  socratic:["QUESTION","ANALYZE_ANSWER","REVEAL"],
  analogy:["ESTABLISH_SOURCE","DRAW_ANALOGY","APPLY_ANALOGY","IDENTIFY_LIMITS","TRANSITION"],
  pbl:["ASSIGN","PLAN_REVIEW","MILESTONE_CHECK","FINAL_REVIEW"],
  spaced_repetition:["QUICK_QUIZ","CONCEPT_MAP","TEACH_BACK","DONE"],
};
const esc = s => (s==null?"":String(s)).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const CMARK = {correct:"✅",partial:"🟡",incorrect:"🔴"};

function stepBar(strategy, state, si){
  const seq = STEPS[strategy]; if(!seq) return "";
  const i = seq.indexOf(state);
  let extra = "";
  if(strategy==="jiangjie" && state==="REDUCE" && si && si.sub_step_count!=null)
    extra = ` ${(si._atom_index??0)}/${si.sub_step_count}`;
  if(strategy==="jiangjie" && state==="COMPLEMENT" && si && si.error_count!=null)
    extra = ` ${(si._error_index??0)}/${si.error_count}`;
  return seq.map((s,k)=>{
    const cls = k<i?"done":(k===i?"active":"");
    const lbl = (k===i?s+extra:s);
    return `<span class="step ${cls}">${esc(lbl)}</span>`+(k<seq.length-1?'<span class="step arrow">→</span>':'');
  }).join(" ");
}

function render(d){
  const root = document.getElementById("root");
  if(!d || d.status==="idle" || !d.current_concept_id){
    root.innerHTML = '<div class="idle">当前没有进行中的学习会话。<br>开一节课（start_learning_session）后这里会实时显示教学状态。</div>';
    return;
  }
  const [fl,fc] = FLOW[d.flow_level] || ["—","#8b98a5"];
  const m = d.mastery||{}, total = m.total||0;
  const prog = d.plan_progress;
  const pct = prog ? Math.round((prog.overall_mastery_ratio||0)*100) : 0;
  const seg = (n,col)=> total? `<span class="seg" style="width:${Math.max(n/total*100,n?3:0)}%;background:${col}"></span>`:"";

  root.innerHTML = `
  <div class="cards">
    <div class="card"><div class="lbl">当前概念</div>
      <div class="val">${esc(d.current_concept_name||"—")}</div>
      <div class="sub">掌握度 ${d.current_mastery!=null?d.current_mastery.toFixed(2):"—"} · 认知负荷 ${d.cognitive_load!=null?d.cognitive_load.toFixed(2):"—"}</div></div>
    <div class="card"><div class="lbl">心流</div>
      <div class="val"><span class="pill" style="background:${fc}22;color:${fc}">${esc(fl)}</span></div>
      <div class="sub">level ${d.flow_level??"—"}</div></div>
    <div class="card"><div class="lbl">策略</div>
      <div class="val">${esc(d.strategy||"—")}</div>
      <div class="sub">${esc(d.strategy_state||"")}</div></div>
  </div>

  ${STEPS[d.strategy]?`<div class="panel"><h2>策略步骤</h2><div class="steps">${stepBar(d.strategy,d.strategy_state,d.strategy_internal)}</div></div>`:""}

  <div class="two">
    <div class="panel"><h2>掌握度分布（${total} 概念）</h2>
      <div class="bar"><span class="name">已掌握</span>${seg(m.mastered,"var(--green)")}<span>${m.mastered||0}</span></div>
      <div class="bar"><span class="name">学习中</span>${seg(m.learning,"var(--yellow)")}<span>${m.learning||0}</span></div>
      <div class="bar"><span class="name">待学</span>${seg(m.weak,"var(--red)")}<span>${m.weak||0}</span></div>
    </div>
    <div class="panel"><h2>最近交互</h2>
      <ul class="hist">${(d.recent_history||[]).slice().reverse().map(h=>
        `<li>${CMARK[h.correctness]||"·"} ${esc(h.correctness||"")} <span style="color:var(--dim)">${esc((h.concept_id||"").split(":").pop())}</span></li>`
      ).join("")||'<li>暂无</li>'}</ul>
    </div>
  </div>

  ${prog?`<div class="panel"><h2>48h 进度 — Phase ${prog.current_phase||"✓"}/${prog.phases.length} · ${prog.concepts_mastered}/${prog.concepts_total} 概念</h2>
    <div class="prog-wrap"><div class="prog"><div class="fill" style="width:${pct}%"></div></div></div>
    <div class="phases">${prog.phases.map(p=>
      `<div class="ph ${p.status}"><div class="pn">P${p.phase} ${esc(p.title)}</div><div class="pv">${p.concepts_mastered}/${p.concepts_total}</div></div>`
    ).join("")}</div></div>`:""}
  `;
}

async function load(){
  const p = document.getElementById("pulse"); p.style.opacity="0.2";
  try{
    const r = await fetch("/api/state"); const d = await r.json();
    render(d);
    document.getElementById("updated").textContent = new Date().toLocaleTimeString();
  }catch(e){ document.getElementById("updated").textContent = "连接失败"; }
  setTimeout(()=>p.style.opacity="1",150);
}
load(); setInterval(load, 3000);
</script>
</body>
</html>
