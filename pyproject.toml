[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-tutor"
version = "0.1.0"
description = "48 小时学完一科 — 私人 AI 辅导系统（v3.0 7 层认知架构）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # MCP 框架
    "fastmcp>=2.0",
    # 数据建模与验证
    "pydantic>=2.6",
    # 持久化
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # 日志
    "structlog>=24.0",
    # HTTP
    "httpx>=0.27",
    # 配置（与 research-tool 一致）
    "pyyaml>=6.0",
    # 异步
    "anyio>=4.0",
    # 数值
    "numpy>=1.26",
    "scipy>=1.12",
    # 图算法（L6 拓扑排序）
    "networkx>=3.3",
    # LLM 兼容客户端（DeepSeek/OpenAI）
    "openai>=1.50",
    # 中文 slug（concept.id 必须 ASCII，需要拼音转写）
    "pypinyin>=0.51",
    "pymupdf>=1.27.2.3",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "pydantic-settings>=2.14.1",
    # 安全下限（D1 收束 pip-audit 实测）：starlette<1.0.1=PYSEC-2026-161 / pyjwt<2.13.0=PYSEC-2026-175/177/178/179
    "starlette>=1.0.1",
    "pyjwt>=2.13.0",
]

[project.optional-dependencies]
# 复用桌面已有的调研引擎：用作 knowledge-mcp 的采集/抽取后端
# 路径绑定见 [tool.uv.sources] 段（uv 装时生效）
# [search] 拉搜索后端（ddgs/arxiv/tavily）；网页抓取走 httpx 回退，无需 crawl4ai
research = ["research-tool[search]"]
# L3 长期记忆 / 向量索引
vector = ["chromadb>=0.5", "sentence-transformers>=3.0"]
# 测试 + 质量门禁（pre-commit / 架构契约）
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "freezegun>=1.5",
    "pre-commit>=3.5",
    "import-linter>=2.0",
    "pip-audit>=2.10",   # 依赖漏洞扫描（收束节点阶段三审计）
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
# 把桌面上已经写好的 research-tool 当本地路径依赖，避免重复实现采集/抽取/搜索
research-tool = { path = "../调研/research-tool", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["shared", "servers", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
# doc/ 下的 v3.1 设计骨架是计划产物（291 份 src/ 桩文件），非生产代码——不纳入 lint
exclude = [
    "doc",
    "ai-tutor-system-design",
    "migrations",
    ".venv",
]

[tool.ruff.lint]
# 原 E/F/I/N/W/UP 基础上加 02-coding §一红线可自动抓的规则：
# T20=禁 print 入库 / T100=禁调试断点 / B=bugbear 常见 bug 形态
select = ["E", "F", "I", "N", "W", "UP", "T20", "T100", "B"]
ignore = [
    "E501",  # 长行交给格式化
    "E741",  # 单字母 l/I/O 局部循环变量（study_pack/research_adapter 少量惯用）
    "N806",  # 项目惯用 UPPER_SNAKE 局部常量（SUBJECT_ID/USER_ID）+ 数学单字母变量
    "N817",  # 领域缩写导入
]

[tool.ruff.lint.per-file-ignores]
# CLI / demo / 一次性脚本：合法 print 到 stdout + sys.path 后置 import + 容忍中间变量
"scripts/**" = ["T201", "E402", "F841"]
"data/**" = ["T201", "E402", "F841"]
"examples/**" = ["T201", "E402", "F841"]
# 测试：assert 惯用 / print 调试 / F841 容忍读值中间变量（少量可能是漏掉的断言，见 worklog 待审）
"tests/**" = ["T201", "E402", "F841"]
"**/tests/**" = ["T201", "E402", "F841"]
"BDD/**" = ["T201", "E402", "F841"]
"conftest.py" = ["E402"]

# ── 架构契约（import-linter）：把 01-architecture 红线变成可拦截规则 ──
# 运行：python -m importlinter lint（已挂进 .pre-commit-config.yaml）
[tool.importlinter]
root_packages = ["shared", "servers", "backend"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "基础设施层 shared 不依赖上层 servers（领域层不依赖框架/禁向上调用）"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["servers"]

[[tool.importlinter.contracts]]
name = "四引擎 server 相互独立（禁跨 server 调用 / 禁循环依赖）"
type = "independence"
modules = [
    "servers.knowledge_mcp",
    "servers.tutoring_mcp",
    "servers.digest_mcp",
    "servers.sync_mcp",
]
# 集成测试合法跨 server（端到端跑教学全链需引别的 server）——契约只管生产代码
ignore_imports = [
    "servers.*.tests.** -> servers.**",
]

[[tool.importlinter.contracts]]
name = "backend.core 是基础设施桥接层，不依赖上层（routers/app/main）与 servers"
type = "forbidden"
source_modules = ["backend.core"]
forbidden_modules = ["backend.routers", "backend.app", "backend.main", "servers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "servers", "BDD", "backend"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
