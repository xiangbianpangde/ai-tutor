[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-tutor"
version = "0.1.0"
description = "48 小时学完一科 — 私人 AI 辅导系统（v3.0 7 层认知架构）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # MCP 框架
    "fastmcp>=2.0",
    # 数据建模与验证
    "pydantic>=2.6",
    # 持久化
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # 日志
    "structlog>=24.0",
    # HTTP
    "httpx>=0.27",
    # 配置（与 research-tool 一致）
    "pyyaml>=6.0",
    # 异步
    "anyio>=4.0",
    # 数值
    "numpy>=1.26",
    "scipy>=1.12",
    # 图算法（L6 拓扑排序）
    "networkx>=3.3",
    # LLM 兼容客户端（DeepSeek/OpenAI）
    "openai>=1.50",
    # 中文 slug（concept.id 必须 ASCII，需要拼音转写）
    "pypinyin>=0.51",
]

[project.optional-dependencies]
# 复用桌面已有的调研引擎：用作 knowledge-mcp 的采集/抽取后端
# 路径绑定见 [tool.uv.sources] 段（uv 装时生效）
research = ["research-tool"]
# L3 长期记忆 / 向量索引
vector = ["chromadb>=0.5", "sentence-transformers>=3.0"]
# 测试
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "freezegun>=1.5",
]

[tool.uv.sources]
# 把桌面上已经写好的 research-tool 当本地路径依赖，避免重复实现采集/抽取/搜索
research-tool = { path = "../调研/research-tool", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["shared", "servers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # 长行交给格式化

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "servers", "BDD"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
